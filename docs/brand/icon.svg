<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#3D5BF0"/>
      <stop offset="1" stop-color="#6A2FD8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M292 330 v364 c0 50 99 90 220 90 s220 -40 220 -90 v-364 z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B1660" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px squircle inset 100px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g filter="url(#shadow)">
    <!-- database cylinder: three stacked disks -->
    <path d="M292 330 v364 c0 50 99 90 220 90 s220 -40 220 -90 v-364 z" fill="url(#disk)"/>
    <ellipse cx="512" cy="330" rx="220" ry="88" fill="#FFFFFF"/>
    <g clip-path="url(#body)">
      <path d="M270 452 c0 50 109 90 242 90 s242 -40 242 -90" fill="none" stroke="#4A63E8" stroke-width="26" opacity="0.55"/>
      <path d="M270 574 c0 50 109 90 242 90 s242 -40 242 -90" fill="none" stroke="#4A63E8" stroke-width="26" opacity="0.55"/>
    </g>
    <ellipse cx="512" cy="330" rx="150" ry="50" fill="#3D5BF0" opacity="0.18"/>
  </g>
  <!-- query badge -->
  <g filter="url(#shadow)">
    <circle cx="716" cy="716" r="132" fill="#13163A"/>
    <path d="M664 662 l64 54 l-64 54" fill="none" stroke="#7FE3B0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M748 784 h52" fill="none" stroke="#7FE3B0" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
