name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK, D-Bus for the keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Platform-independent checks run once.
      - name: Lint (Biome)
        if: runner.os == 'macOS'
        run: pnpm lint
      - name: Type-check
        if: runner.os == 'macOS'
        run: pnpm typecheck
      - name: Web unit tests
        if: runner.os == 'macOS'
        run: pnpm test:web
      - name: rustfmt
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Build web UI (embedded by Tauri)
        run: pnpm web:build
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Start a real PostgreSQL for integration tests
        run: |
          node dev/real-db.ts > real-db.log 2>&1 &
          for i in $(seq 1 90); do grep -q DATAGRABBER_TEST_PG real-db.log && break; sleep 1; done
          cat real-db.log
      - name: Rust unit and integration tests
        working-directory: src-tauri
        env:
          DATAGRABBER_TEST_PG: 54330
          DATAGRABBER_SECRETS: memory
        run: cargo test
