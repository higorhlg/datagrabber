name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Built on the oldest supported Ubuntu so the packages run on newer distributions too.
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ''
            args: --bundles deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (WebKitGTK, D-Bus for the keyring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev pkg-config

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Datagrabber ${{ github.ref_name }}
          releaseBody: |
            **macOS** (Apple Silicon and Intel): `Datagrabber_*_universal.dmg`. Not notarized yet: on first
            launch right-click Datagrabber.app → Open, or run `xattr -dr com.apple.quarantine /Applications/Datagrabber.app`.

            **Linux** (x64): `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distro).
            Needs WebKitGTK 4.1; 2.40 or newer is recommended (Ubuntu 24.04+, Fedora 39+). Passwords are
            stored in the Secret Service (GNOME Keyring, KWallet).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
