[package]
name = "datagrabber"
version = "0.1.0"
description = "A fast, safe PostgreSQL desktop client"
authors = ["Higor"]
license = "Apache-2.0"
repository = "https://github.com/higorhlg/datagrabber"
edition = "2024"
rust-version = "1.90"

[lib]
name = "datagrabber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
dbus-secret-service = { version = "4", features = ["crypto-rust"] }
