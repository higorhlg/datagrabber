name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Datagrabber ${{ github.ref_name }}
          releaseBody: |
            Universal macOS build (Apple Silicon and Intel). The app is not notarized yet:
            on first launch, right-click Datagrabber.app → Open, or run
            `xattr -dr com.apple.quarantine /Applications/Datagrabber.app`.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
